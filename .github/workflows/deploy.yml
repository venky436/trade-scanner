name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p apps/server/tsconfig.json

  build-and-deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: venky436/trading-backend:latest
          platforms: linux/amd64

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: venky436/trading-frontend:latest
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=https://tradescanner.io
            NEXT_PUBLIC_WS_URL=wss://tradescanner.io/ws

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: 64.227.145.12
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            docker pull venky436/trading-backend:latest
            docker pull venky436/trading-frontend:latest
            cd /opt/trading-scanner
            docker compose down && docker compose up -d
            docker image prune -f
